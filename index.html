<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Wolves 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0d0f0e;--card:#161a18;--line:#26302b;--tx:#e8ece9;--mu:#8a9690;--up:#4ade80;--dn:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:980px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:Georgia,serif;font-size:32px;margin:0}.sub{color:var(--mu);font-size:13px;margin:4px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.rk{width:28px;font-family:ui-monospace,monospace;color:var(--mu)}
.nm{flex:1;font-weight:600}.pc{font-family:ui-monospace,monospace;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}
.det{display:none;padding:6px 4px 12px 40px;color:var(--mu);font-size:13px}.det.o{display:block}
.det div{display:flex;justify-content:space-between;max-width:420px;padding:2px 0}
.msg{padding:14px;border:1px solid var(--line);border-radius:10px;color:var(--mu)}
.err{color:var(--dn)}.note{color:var(--mu);font-size:12px;margin-top:14px}
canvas{max-height:360px}
</style></head><body><div class="w">
<h1>Market Wolves 2026</h1>
<div class="sub" id="sub">Loading…</div>
<div id="app"><div class="msg">Loading data…</div></div>
<div class="note">Total return including dividends (dividend-adjusted closes) from Jan 7, 2026. Portfolio return = Σ weight × ETF return. Refreshes automatically.</div>
</div>
<script>
const PLAYERS=[
{name:'Jalfery',etfs:[{t:'IEF',w:.45},{t:'GLD',w:.30},{t:'DBMF',w:.25}]},
{name:'Gray Guy',etfs:[{t:'SMH',w:.40},{t:'DRIV',w:.35},{t:'AGG',w:.25}]},
{name:'JPenis',etfs:[{t:'VTEB',w:.40},{t:'SHLD',w:.35},{t:'NLR',w:.25}]},
{name:'Stew',etfs:[{t:'AIQ',w:1/3},{t:'XBI',w:1/3},{t:'XAR',w:1/3}]},
{name:'Chino Bot 4.0',etfs:[{t:'ARGT',w:.10},{t:'ARKK',w:.40},{t:'BETE',w:.50}]},
{name:'GarrBear',etfs:[{t:'TQQQ',w:1}]}];
const COLORS=['#4ade80','#60a5fa','#fbbf24','#f472b6','#a78bfa','#fb923c'];
const pct=v=>(v>=0?'+':'')+(v*100).toFixed(2)+'%';
const cls=v=>v>=0?'up':'dn';
// Optional: paste your Cloudflare Worker URL here for near-real-time data (see README). Leave '' to use data.json only.
const LIVE_URL='';
async function getJSON(u,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.error)throw new Error(j.error);return j}finally{clearTimeout(t)}}
async function load(first){
 let d=null;
 if(LIVE_URL){try{d=await getJSON(LIVE_URL,10000)}catch(e){console.warn('live feed failed, using data.json',e)}}
 if(!d){try{d=await getJSON('data.json?'+Date.now(),10000)}catch(e){if(first){document.getElementById('sub').textContent='';
  document.getElementById('app').innerHTML='<div class="msg err">Could not load data.json: '+e.message+'. If this is first setup, run the "Update prices" workflow from the repo Actions tab.</div>'}return}}
 render(d);
}
load(true);setInterval(()=>load(false),LIVE_URL?60000:120000);
let charts=[];
function render(d){
 charts.forEach(c=>c.destroy());charts=[];
 const n=d.dates.length-1;
 const last=t=>{const s=d.series[t];for(let i=n;i>=0;i--)if(s[i]!=null)return s[i];return 0};
 const port=p=>d.dates.map((_,i)=>p.etfs.reduce((a,e)=>a+e.w*(d.series[e.t][i]??0),0));
 const rows=PLAYERS.map((p,i)=>({p,c:COLORS[i],ser:port(p)})).map(o=>({...o,r:o.ser[n]})).sort((a,b)=>b.r-a.r);
 document.getElementById('sub').textContent='Data through '+d.dates[n]+' · refreshed '+new Date(d.updated).toLocaleString();
 let h='<div class="card">'+rows.map((o,i)=>`<div class="row" onclick="this.nextElementSibling.classList.toggle('o')"><span class="rk">${i+1}</span><span class="nm" style="color:${o.c}">${o.p.name}</span><span class="pc ${cls(o.r)}">${pct(o.r)}</span></div><div class="det">${o.p.etfs.map(e=>`<div><span>${e.t} · ${(e.w*100).toFixed(0)}%</span><span class="${cls(last(e.t))}">${pct(last(e.t))}</span></div>`).join('')}</div>`).join('')+'</div>';
 h+='<div class="card"><canvas id="ln"></canvas></div><div class="card"><canvas id="bar"></canvas></div>';
 document.getElementById('app').innerHTML=h;
 const grid={color:'#26302b'},tick={color:'#8a9690'};
 if(typeof Chart==='undefined'){document.querySelectorAll('canvas').forEach(c=>c.parentNode.remove());return}
 charts.push(new Chart(ln,{type:'line',data:{labels:d.dates,datasets:rows.map(o=>({label:o.p.name,data:o.ser.map(v=>v*100),borderColor:o.c,borderWidth:2,pointRadius:0,tension:.2}))},
  options:{plugins:{legend:{labels:{color:'#e8ece9'}},title:{display:true,text:'Cumulative total return (%)',color:'#e8ece9'}},scales:{x:{ticks:{...tick,maxTicksLimit:8},grid},y:{ticks:tick,grid}},interaction:{mode:'index',intersect:false},animation:false}}));
 charts.push(new Chart(bar,{type:'bar',data:{labels:rows.map(o=>o.p.name),datasets:[{data:rows.map(o=>o.r*100),backgroundColor:rows.map(o=>o.c)}]},
  options:{plugins:{legend:{display:false},title:{display:true,text:'Current total return (%)',color:'#e8ece9'}},scales:{x:{ticks:tick,grid},y:{ticks:tick,grid}},animation:false}}));
}
</script></body></html>
