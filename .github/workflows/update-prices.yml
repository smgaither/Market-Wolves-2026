name: Update prices
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # every 5 min during US market hours (covers EST+EDT)
    - cron: "15 22 * * 1-5"       # final close
  workflow_dispatch: {}
concurrency:
  group: update-prices
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install yfinance pandas
      - run: python update_prices.py
      - name: Commit data.json
        run: |
          git config user.name "market-wolves-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update prices" && git pull --rebase -q && git push)
